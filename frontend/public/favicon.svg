<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="greenDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main Green PDF Document Base -->
  <path d="M14 6C11.7909 6 10 7.79086 10 10V54C10 56.2091 11.7909 58 14 58H50C52.2091 58 54 56.2091 54 54V22L38 6H14Z" fill="url(#greenDocGrad)" filter="url(#shadow)"/>

  <!-- Folded Page Corner -->
  <path d="M38 6V17C38 19.7614 40.2386 22 43 22H54L38 6Z" fill="url(#foldGrad)"/>

  <!-- Subtle Document Header Lines -->
  <rect x="18" y="19" width="14" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="18" y="25" width="22" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Bold White PDF Badge -->
  <rect x="14" y="34" width="36" height="16" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- PDF Lettering in Leaf Green -->
  <text x="32" y="46.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#15803d" text-anchor="middle" letter-spacing="0.5">PDF</text>
</svg>